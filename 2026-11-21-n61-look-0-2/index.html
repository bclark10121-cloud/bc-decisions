<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinkhole Story 0.2: the real look</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Decision page (G0.16), built from templates/decision-page in game-studio. Sinkhole Story 0.2 look page with Nano Banana Pro pictures (G8.8).
     Added to the template for this page: media {still: "name"} draws a sketch once (no Moving preview tag) and media {font: "Name"} sets the title in a web font. -->
<style>
:root{--bg:#14121c;--card:#1f1c2b;--ink:#f1ece2;--mute:#a9a2b8;--acc:#f2b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header,main{max-width:none;margin:0;padding:0 28px}header{padding-top:28px}main{padding-bottom:130px}
h1{font:600 28px Fraunces,serif;margin:0 0 6px}h2{font:600 21px Fraunces,serif;margin:28px 0 0}
.mute{color:var(--mute)}.note{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(832px,100%),832px));justify-content:start;gap:16px;margin-top:10px}
.card{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px}.card.on{border-color:var(--acc)}
.opt{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
h3{margin:2px 0 4px;font-size:17px}.meta{color:var(--mute);font-size:13px}
.card img,.card video{width:100%;max-width:800px;border-radius:10px;margin:8px 0}audio{width:100%;margin:10px 0 8px}
.card canvas{width:100%;max-width:800px;aspect-ratio:4/3;border-radius:10px;margin:8px 0;background:#000;display:block}
.fontbox{max-width:800px;border-radius:10px;margin:8px 0;padding:54px 16px;text-align:center;background:linear-gradient(#39b3c2 0 16%,#eafcfb 16% 19%,#f4e3b5 19%);color:#3a2a1c;font-size:clamp(34px,8vw,76px);line-height:1.1;text-shadow:0 3px 0 #fff7ea}
.fontbox small{display:block;font:600 13px Inter,sans-serif;color:#6b5a45;text-shadow:none;margin-top:14px}
.rec{display:inline-block;background:#2e2a40;color:var(--acc);font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#2e2a40;color:var(--ink)}
.card.on .pick{background:var(--acc);color:#1b1608}
textarea{width:100%;margin-top:10px;background:var(--card);color:var(--ink);border:1px solid #2e2a40;border-radius:10px;padding:10px;font:14px Inter,sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0c13ee;border-top:1px solid #2e2a40;padding:12px 20px}
.bar div{margin:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#sum{flex:1;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#copy{background:var(--acc);color:#1b1608}.spd.on{background:#4a4368;color:var(--acc)}.live{position:relative}.live:after{content:'\25CF  Moving preview';position:absolute;left:10px;top:18px;font:600 11px Inter,sans-serif;color:#fff;background:#0009;border-radius:6px;padding:2px 7px}
</style></head><body>
<header><h1 id="title"></h1><p class="mute" id="intro"></p><div class="note" id="note"></div></header>
<main id="main"></main>
<div class="bar"><div><span id="sum">No picks yet.</span><span class="mute" style="font-size:13px">Preview speed</span><button class="spd" data-s="1">1x</button><button class="spd on" data-s="2">2x</button><button class="spd" data-s="4">4x</button><button id="copy">Copy my picks</button></div></div>
<script>
const NAME='Sinkhole Story';
const SCENES = {};
const DECISION = {
  title: "Sinkhole Story 0.2: the real look",
  intro: "Pick the real look for the Snack Shack lot. Every picture here is Nano Banana Pro concept art, not a code sketch. One pick per question.",
  note: "These are concept pictures. The game's 3D models and menus get built to match your picks. Your pick in the first section becomes the approved reference picture that every later picture must match (G8.6). The pictures in the other sections were made in the Glossy plastic look. If you pick another look, I remake your picked designs in it, at about 13 cents a picture. The 18 pictures here cost about $2.41 on your Google project. Click a picture to open it full size in a new tab. The 0.2 gameplay (the real lot, Rumble, The Haul, stars, crabs and gulls) is being built now with stand-in shapes and needs no picks.",
  label: "Sinkhole Story 0.2 picks",
  questions: [
    { id: "style", name: "The look of the lot", sub: "The approved reference picture for the whole game (G8.6). All three are clean toy render, your earlier pick. They differ in material.",
      options: [
        { title: "Glossy plastic", meta: ["Smooth shiny molded toys, bright colors, deep sand and rolling sea", "Closest to Brickhop, Tiny Tailwind and Marble Rush"], media: {img: "img/lot_a_glossy.jpg"}, rec: true },
        { title: "Soft vinyl and clay", meta: ["Matte and rounded, softer colors, like a handmade stop motion set", "Calmest, a little flatter on a phone"], media: {img: "img/lot_b_vinyl.jpg"} },
        { title: "Painted wood", meta: ["Wooden toys with painted colors and a little grain", "Warmest, most detail to model"], media: {img: "img/lot_c_wood.jpg"} } ] },
    { id: "shack", name: "The Snack Shack", sub: "The last and biggest thing on the lot. It gets a full 3D model through Meshy.",
      options: [
        { title: "Classic stand", meta: ["Cream walls, red and white awning, the giant cone on a flat roof", "Matches the lot pictures"], media: {img: "img/shack_a_classic.jpg"}, rec: true },
        { title: "Surf hut", meta: ["Teal planks, yellow awning, surfboards on the side"], media: {img: "img/shack_b_surf.jpg"} },
        { title: "Round kiosk", meta: ["Round, with a carousel style roof and the cone on top"], media: {img: "img/shack_c_round.jpg"} } ] },
    { id: "hole", name: "The hole", sub: "You picked the Sandy sinkhole. This sets how its rim looks up close.",
      options: [
        { title: "Crumbly rim", meta: ["A soft raised lip with loose sand sliding in", "Reads as a sinkhole"], media: {img: "img/hole_a_crumbly.jpg"}, rec: true },
        { title: "Scooped rim", meta: ["Clean and smooth with a ring of damp sand", "Simplest to draw at every size"], media: {img: "img/hole_b_scooped.jpg"} },
        { title: "Cracked rim", meta: ["Cartoon cracks and puffs of dust", "Most lively"], media: {img: "img/hole_c_cracked.jpg"} } ] },
    { id: "fisher", name: "The fisher", sub: "The storyteller of the tall tale. This face shows in the talk box and on The Haul.",
      options: [
        { title: "The mustache", meta: ["Stout old man, white mustache, round glasses, navy knit cap, teal sweater"], media: {img: "img/fisher_a_mustache.jpg"}, rec: true },
        { title: "The braid", meta: ["Wiry old woman, gray braid, straw hat with a lure, coral scarf"], media: {img: "img/fisher_b_braid.jpg"} },
        { title: "The bucket hat", meta: ["Tall thin old man, droopy mustache, yellow bucket hat full of lures"], media: {img: "img/fisher_c_buckethat.jpg"} } ] },
    { id: "critters", name: "Crabs and gulls", sub: "They wander the lot, can be swallowed and pop back out unharmed (Cheekier, your pick).",
      options: [
        { title: "Round and cheerful", meta: ["Chunky and cute"], media: {img: "img/critters_a_round.jpg"} },
        { title: "Grumpy", meta: ["Annoyed and funny", "Fits the pop back out moment best"], media: {img: "img/critters_b_grumpy.jpg"}, rec: true },
        { title: "Simple", meta: ["Bead toy shapes with dot eyes", "Cheapest to model and animate"], media: {img: "img/critters_c_simple.jpg"} } ] },
    { id: "icon", name: "APK icon", sub: "Your pick was Beach ball on the rim. Three real versions (G6.10).",
      options: [
        { title: "Slant view with sea", meta: ["Like the game camera, a strip of sea at the top"], media: {img: "img/icon_a_slant.jpg"}, rec: true },
        { title: "Close up", meta: ["The hole fills the lower half, the ball on the rim"], media: {img: "img/icon_b_close.jpg"} },
        { title: "From straight above", meta: ["Hole in the center, ball half over it, shells around", "It came back with rounded corners. I remake it square if you pick it"], media: {img: "img/icon_c_top.jpg"} } ] },
    { id: "meshy", name: "Big pieces made in Meshy", sub: "You chose a mix: Meshy for the big hero pieces, the small items built in code to match. Meshy runs in your Chrome at about 35 credits a model.",
      options: [
        { title: "Six pieces, about 210 credits", meta: ["Snack Shack, giant cone sign, ice cream cart, lifeguard chair, rowboat, beach umbrella"], rec: true },
        { title: "Three pieces, about 105 credits", meta: ["Snack Shack, ice cream cart, lifeguard chair", "The cone sign, rowboat and umbrella are built in code"] },
        { title: "Eight pieces, about 280 credits", meta: ["The six, plus the beach chair and the boombox"] } ] } ]
};
const $=s=>document.querySelector(s), picks={};
$('#title').textContent=DECISION.title;$('#intro').textContent=DECISION.intro;$('#note').textContent=DECISION.note;
for(const q of DECISION.questions){
  const sec=document.createElement('section');
  sec.innerHTML=`<h2></h2><p class="mute"></p><div class="grid"></div><textarea rows="2" placeholder="Notes for this one (optional)"></textarea>`;
  sec.querySelector('h2').textContent=q.name;sec.querySelector('p').textContent=q.sub||'';
  q.options.forEach((o,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="opt">Option ${String.fromCharCode(65+i)}${o.rec?'<span class="rec">Recommended</span>':''}</div><h3></h3>`;
    c.querySelector('h3').textContent=o.title;
    for(const m of (o.meta||[])){const d=document.createElement('div');d.className='meta';d.textContent=m;c.appendChild(d)}
    const md=o.media||{};
    if(md.img){const e=document.createElement('img');e.src=md.img;e.alt=o.title;e.style.cursor='zoom-in';e.onclick=()=>window.open(e.src,'_blank');c.appendChild(e)}
    if(md.font){const e=document.createElement('div');e.className='fontbox';e.style.fontFamily=`'${md.font}',sans-serif`;e.textContent=NAME;const s=document.createElement('small');s.textContent=md.font;e.appendChild(s);c.appendChild(e)}
    if(md.still&&SCENES[md.still]){const e=document.createElement('canvas');e.width=800;e.height=600;e.dataset.still=md.still;c.appendChild(e)}
    if(md.draw&&SCENES[md.draw]){const e=document.createElement('canvas');e.width=800;e.height=600;e.dataset.draw=md.draw;const wr=document.createElement('div');wr.className='live';wr.appendChild(e);c.appendChild(wr)}
    if(md.audio){const e=document.createElement('audio');e.src=md.audio;e.controls=true;e.preload='none';c.appendChild(e)}
    const b=document.createElement('button');b.className='pick';b.textContent='Pick this one';c.appendChild(b);
    b.onclick=()=>{sec.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');picks[q.id]={q:q.name,o:o.title,n:(picks[q.id]||{}).n};draw()};
    sec.querySelector('.grid').appendChild(c)});
  sec.querySelector('textarea').oninput=e=>{(picks[q.id]=picks[q.id]||{q:q.name,o:''}).n=e.target.value;draw()};
  $('#main').appendChild(sec)}
function stills(){document.querySelectorAll('canvas[data-still]').forEach(c=>{const g=c.getContext('2d');g.save();SCENES[c.dataset.still](g,0,c.width,c.height);g.restore()})}
stills();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(stills);
const cvs=[...document.querySelectorAll('canvas[data-draw]')],seen=new Set();
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting?seen.add(x.target):seen.delete(x.target)));cvs.forEach(c=>io.observe(c));
let speed=2,clock=0,last=0;document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on',x===b))});
(function loop(ms){clock+=Math.min(100,ms-last)/1000*speed;last=ms;for(const c of seen){const g=c.getContext('2d');g.save();SCENES[c.dataset.draw](g,clock,c.width,c.height);g.restore()}requestAnimationFrame(loop)})(0);
document.addEventListener('play',e=>{document.querySelectorAll('audio,video').forEach(o=>{if(o!==e.target)o.pause()})},true);
function text(){return DECISION.label+': '+DECISION.questions.filter(q=>picks[q.id]).map(q=>{const p=picks[q.id];return q.name+': '+(p.o||'no pick')+(p.n&&p.n.trim()?' ('+p.n.trim()+')':'')}).join('. ')+'.'}
function draw(){const n=DECISION.questions.filter(q=>picks[q.id]&&picks[q.id].o).length;$('#sum').textContent=n?`${n} of ${DECISION.questions.length} picked`+(n<DECISION.questions.length?'':'. Press Copy my picks.'):'No picks yet.'}
$('#copy').onclick=async e=>{try{await navigator.clipboard.writeText(text());e.target.textContent='Copied'}catch(err){e.target.textContent='Select the text to copy'}setTimeout(()=>e.target.textContent='Copy my picks',1800)};
</script></body></html>
