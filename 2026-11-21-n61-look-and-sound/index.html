<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinkhole Story: look and sound</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600;700&family=Bowlby+One&family=Pacifico&family=Rammetto+One&display=swap" rel="stylesheet">
<!-- Decision page (G0.16), built from templates/decision-page in game-studio. New game look and sound page for N61 Sinkhole Story.
     Added to the template for this page: media {still: "name"} draws a sketch once (no Moving preview tag) and media {font: "Name"} sets the title in a web font. -->
<style>
:root{--bg:#14121c;--card:#1f1c2b;--ink:#f1ece2;--mute:#a9a2b8;--acc:#f2b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header,main{max-width:none;margin:0;padding:0 28px}header{padding-top:28px}main{padding-bottom:130px}
h1{font:600 28px Fraunces,serif;margin:0 0 6px}h2{font:600 21px Fraunces,serif;margin:28px 0 0}
.mute{color:var(--mute)}.note{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(832px,100%),832px));justify-content:start;gap:16px;margin-top:10px}
.card{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px}.card.on{border-color:var(--acc)}
.opt{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
h3{margin:2px 0 4px;font-size:17px}.meta{color:var(--mute);font-size:13px}
.card img,.card video{width:100%;max-width:800px;border-radius:10px;margin:8px 0}audio{width:100%;margin:10px 0 8px}
.card canvas{width:100%;max-width:800px;aspect-ratio:4/3;border-radius:10px;margin:8px 0;background:#000;display:block}
.fontbox{max-width:800px;border-radius:10px;margin:8px 0;padding:54px 16px;text-align:center;background:linear-gradient(#39b3c2 0 16%,#eafcfb 16% 19%,#f4e3b5 19%);color:#3a2a1c;font-size:clamp(34px,8vw,76px);line-height:1.1;text-shadow:0 3px 0 #fff7ea}
.fontbox small{display:block;font:600 13px Inter,sans-serif;color:#6b5a45;text-shadow:none;margin-top:14px}
.rec{display:inline-block;background:#2e2a40;color:var(--acc);font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#2e2a40;color:var(--ink)}
.card.on .pick{background:var(--acc);color:#1b1608}
textarea{width:100%;margin-top:10px;background:var(--card);color:var(--ink);border:1px solid #2e2a40;border-radius:10px;padding:10px;font:14px Inter,sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0c13ee;border-top:1px solid #2e2a40;padding:12px 20px}
.bar div{margin:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#sum{flex:1;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#copy{background:var(--acc);color:#1b1608}.spd.on{background:#4a4368;color:var(--acc)}.live{position:relative}.live:after{content:'\25CF  Moving preview';position:absolute;left:10px;top:18px;font:600 11px Inter,sans-serif;color:#fff;background:#0009;border-radius:6px;padding:2px 7px}
</style></head><body>
<header><h1 id="title"></h1><p class="mute" id="intro"></p><div class="note" id="note"></div></header>
<main id="main"></main>
<div class="bar"><div><span id="sum">No picks yet.</span><span class="mute" style="font-size:13px">Preview speed</span><button class="spd" data-s="1">1x</button><button class="spd on" data-s="2">2x</button><button class="spd" data-s="4">4x</button><button id="copy">Copy my picks</button></div></div>
<script>
// ---------- sketch kit ----------
const TAU=Math.PI*2, NAME='Sinkhole Story';
const DAY={sea:'#39b3c2',foam:'#eafcfb',sand:'#f4e3b5',sand2:'#e6cf98',wood:'#c9975f',wood2:'#a97a47'};
const DUSK={sea:'#e9806a',foam:'#ffe1c4',sand:'#f2c79a',sand2:'#dfa877',wood:'#9a5f4d',wood2:'#7a4638'};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function el(g,x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,TAU);g.fill()}
function rr(g,x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function beach(g,x,y,w,h,t,p,sea,walk){p=p||DAY;const sy=y+h*sea,by=y+h*walk;
  g.fillStyle=p.sand;g.fillRect(x,y,w,h);
  g.fillStyle=p.sand2;for(let i=0;i<60;i++){g.fillRect(x+(i*197)%w,sy+18+((i*113)%Math.max(10,by-sy-26)),4,2)}
  if(sea>0){g.fillStyle=p.foam;g.beginPath();g.moveTo(x,y);for(let k=0;k<=w;k+=16)g.lineTo(x+k,sy+10+Math.sin(k*.025+t*1.3)*6);g.lineTo(x+w,y);g.fill();
    g.fillStyle=p.sea;g.beginPath();g.moveTo(x,y);for(let k=0;k<=w;k+=16)g.lineTo(x+k,sy+Math.sin(k*.025+t*1.3+.8)*6);g.lineTo(x+w,y);g.fill()}
  if(walk<1){g.fillStyle=p.wood;g.fillRect(x,by,w,y+h-by);g.strokeStyle=p.wood2;g.lineWidth=2;for(let k=0;k<w;k+=46){g.beginPath();g.moveTo(x+k,by);g.lineTo(x+k,y+h);g.stroke()}g.fillStyle='rgba(0,0,0,.14)';g.fillRect(x,by,w,5)}}
function shadow(g,x,y,rx){el(g,x,y,rx,rx*.33,'rgba(60,40,20,.2)')}
function hole(g,x,y,r,style,t,sq){sq=sq||.6;const ry=r*sq;style=style||'sand';
  if(style==='ring'){const n=12;for(let i=0;i<n;i++){g.fillStyle=i%2?'#fff7ea':'#e2493f';g.beginPath();g.ellipse(x,y,r*1.22,ry*1.22,0,i/n*TAU,(i+1)/n*TAU);g.ellipse(x,y,r*.98,ry*.98,0,(i+1)/n*TAU,i/n*TAU,true);g.fill()}}
  else if(style==='swirl'){el(g,x,y,r*1.12,ry*1.12,'#8fe3d9');el(g,x,y,r*1.05,ry*1.05,'#2aa7a8')}
  else{el(g,x,y,r*1.14,ry*1.14,'#e0c98f');el(g,x,y,r*1.06,ry*1.06,'#b99a62')}
  el(g,x,y,r,ry,style==='swirl'?'#0f6a73':style==='ring'?'#2f3a4a':'#4a3a28');
  g.save();g.beginPath();g.ellipse(x,y,r,ry,0,0,TAU);g.clip();
  const gr=g.createRadialGradient(x,y+ry*.5,r*.05,x,y+ry*.4,r*1.05);
  if(style==='swirl'){gr.addColorStop(0,'#01090b');gr.addColorStop(1,'#07363c')}else{gr.addColorStop(0,'#020306');gr.addColorStop(1,'#101823')}
  el(g,x,y+ry*.36,r*1.02,ry*1.02,gr);
  if(style==='swirl'){g.strokeStyle='rgba(143,227,217,.6)';g.lineWidth=Math.max(1.5,r*.045);for(let k=0;k<3;k++){g.beginPath();for(let a=0;a<4.4;a+=.15){const rad=r*(1-a/4.6),ang=a+(t||0)*1.5+k*TAU/3,px=x+Math.cos(ang)*rad,py=y+Math.sin(ang)*rad*sq;a?g.lineTo(px,py):g.moveTo(px,py)}g.stroke()}}
  g.restore()}
function ball(g,x,y,r,rot){shadow(g,x+r*.15,y+r*.95,r);const cs=['#e2493f','#fff7ea','#f5c63a','#fff7ea','#2f8fd0','#fff7ea'];for(let i=0;i<6;i++){g.fillStyle=cs[i];g.beginPath();g.moveTo(x,y);g.arc(x,y,r,(rot||0)+i*TAU/6,(rot||0)+(i+1)*TAU/6);g.fill()}el(g,x-r*.3,y-r*.38,r*.22,r*.15,'rgba(255,255,255,.65)')}
function shell(g,x,y,s,c){g.fillStyle=c||'#f6a6a0';g.beginPath();g.arc(x,y,s,Math.PI,0);g.lineTo(x,y+s*.55);g.fill();g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=Math.max(1,s*.12);for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x,y+s*.4);g.lineTo(x+i*s*.38,y-s*.75);g.stroke()}}
function pail(g,x,y,s,c){shadow(g,x,y+s*.55,s*.7);g.fillStyle=c||'#e2493f';g.beginPath();g.moveTo(x-s*.6,y-s*.5);g.lineTo(x+s*.6,y-s*.5);g.lineTo(x+s*.42,y+s*.55);g.lineTo(x-s*.42,y+s*.55);g.fill();el(g,x,y-s*.5,s*.6,s*.18,'#f5c63a');g.strokeStyle='#fff7ea';g.lineWidth=s*.09;g.beginPath();g.arc(x,y-s*.5,s*.6,Math.PI,0);g.stroke()}
function umbrella(g,x,y,s,c,tilt){g.save();g.translate(x,y);shadow(g,s*.1,0,s*.8);g.rotate(tilt||0);g.strokeStyle='#f1ede4';g.lineWidth=s*.07;g.beginPath();g.moveTo(0,0);g.lineTo(0,-s*1.5);g.stroke();
  for(let i=0;i<8;i++){g.fillStyle=i%2?'#fff7ea':(c||'#e2493f');g.beginPath();g.moveTo(0,-s*1.5);g.ellipse(0,-s*1.5,s,s*.42,0,i/8*TAU,(i+1)/8*TAU);g.fill()}el(g,0,-s*1.5,s*.09,s*.05,'#f5c63a');g.restore()}
function canopy(g,x,y,r,c,rot){for(let i=0;i<8;i++){g.fillStyle=i%2?'#fff7ea':(c||'#e2493f');g.beginPath();g.moveTo(x,y);g.arc(x,y,r,(rot||0)+i/8*TAU,(rot||0)+(i+1)/8*TAU);g.fill()}el(g,x,y,r*.09,r*.09,'#f5c63a')}
function chair(g,x,y,s,c){shadow(g,x,y+s*.32,s*.7);g.save();g.translate(x,y);g.strokeStyle='#a97a47';g.lineWidth=s*.09;g.lineCap='round';g.beginPath();g.moveTo(-s*.45,s*.3);g.lineTo(s*.3,-s*.9);g.moveTo(-s*.5,-s*.15);g.lineTo(s*.6,s*.3);g.stroke();
  g.fillStyle=c||'#2f8fd0';g.beginPath();g.moveTo(-s*.4,s*.18);g.lineTo(-s*.05,s*.3);g.lineTo(s*.58,-s*.72);g.lineTo(s*.24,-s*.86);g.fill();g.strokeStyle='#fff7ea';g.lineWidth=s*.06;for(const k of [.3,.6]){g.beginPath();g.moveTo(-s*.4+k*.35*s,s*.18+k*.12*s);g.lineTo(s*.24+k*.34*s,-s*.86+k*.14*s);g.stroke()}g.restore()}
function cone(g,x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot||0);g.fillStyle='#d9a55c';g.beginPath();g.moveTo(-s*.45,-s*.1);g.lineTo(s*.45,-s*.1);g.lineTo(0,s*1.1);g.fill();g.strokeStyle='#b9833d';g.lineWidth=Math.max(1,s*.04);g.beginPath();g.moveTo(-s*.3,-s*.1);g.lineTo(s*.12,s*.8);g.moveTo(s*.3,-s*.1);g.lineTo(-s*.12,s*.8);g.stroke();
  el(g,0,-s*.38,s*.56,s*.5,'#f7a8c4');el(g,-s*.17,-s*.55,s*.15,s*.1,'rgba(255,255,255,.65)');el(g,0,-s*.9,s*.13,s*.13,'#e2493f');g.restore()}
function shack(g,x,y,s,o){o=o||{};g.save();g.translate(x,y);g.rotate(o.tilt||0);shadow(g,0,0,s*1.15);
  rr(g,-s,-s*1.1,s*2,s*1.1,6,'#fff3dc');rr(g,-s*.7,-s*.82,s*1.4,s*.46,4,'#5b3b2a');rr(g,-s*.8,-s*.4,s*1.6,s*.1,3,'#c9975f');
  g.fillStyle=o.roof||'#2f8fd0';g.beginPath();g.moveTo(-s*1.1,-s*1.1);g.lineTo(-s*.8,-s*1.5);g.lineTo(s*.8,-s*1.5);g.lineTo(s*1.1,-s*1.1);g.fill();
  const n=8,sw=s*2.2/n;for(let i=0;i<n;i++){g.fillStyle=i%2?'#fff7ea':'#e2493f';const x0=-s*1.1+i*sw;g.beginPath();g.moveTo(x0,-s*1.1);g.lineTo(x0+sw,-s*1.1);g.lineTo(x0+sw,-s*.9);g.arc(x0+sw/2,-s*.9,sw/2,0,Math.PI);g.fill()}
  if(!o.noCone)cone(g,0,-s*1.5-s*.55,s*.5,o.coneRot||0);g.restore()}
function drop(g,k,x,y,hx,hy,draw){if(k>=1)return;if(k<=0){draw(x,y,1);return}g.save();g.globalAlpha=1-k*k;draw(x+(hx-x)*k,y+(hy-y)*k+k*10,1-k*.6);g.restore()}
function title(g,w,h,c,y){g.fillStyle=c;g.font='700 60px Inter,sans-serif';g.textAlign='center';g.fillText(NAME,w*.5,h*(y||.18))}
function ringHud(g,x,y,r,k,label){g.lineWidth=r*.28;g.strokeStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();g.strokeStyle='#f2b84b';g.beginPath();g.arc(x,y,r,-Math.PI/2,-Math.PI/2+TAU*k);g.stroke();g.fillStyle='#3a2a1c';g.font='700 '+Math.round(r*.8)+'px Inter,sans-serif';g.textAlign='center';g.fillText(label,x,y+r*.28)}
// icon art, one rounded square
function iconArt(g,x,y,S,v){g.save();g.beginPath();g.roundRect(x,y,S,S,S*.22);g.clip();
  if(v==='a'){g.fillStyle=DAY.sand;g.fillRect(x,y,S,S);g.fillStyle=DAY.sea;g.fillRect(x,y,S,S*.2);g.fillStyle=DAY.foam;g.fillRect(x,y+S*.2,S,S*.035);hole(g,x+S*.46,y+S*.66,S*.33,'sand',0,.62);ball(g,x+S*.7,y+S*.4,S*.19,.5)}
  if(v==='b'){g.fillStyle=DAY.sand;g.fillRect(x,y,S,S);hole(g,x+S*.5,y+S*.52,S*.34,'sand',0,1);g.save();g.beginPath();g.rect(x,y,S,S);g.clip();canopy(g,x+S*.66,y+S*.34,S*.3,'#e2493f',.3);g.restore()}
  if(v==='c'){const gr=g.createLinearGradient(0,y,0,y+S);gr.addColorStop(0,'#f7b38a');gr.addColorStop(.55,'#e9806a');gr.addColorStop(.56,DUSK.sand);gr.addColorStop(1,DUSK.sand);g.fillStyle=gr;g.fillRect(x,y,S,S);el(g,x+S*.78,y+S*.2,S*.11,S*.11,'#ffe9b0');hole(g,x+S*.5,y+S*.76,S*.33,'sand',0,.55);cone(g,x+S*.5,y+S*.34,S*.26,.35)}
  g.restore()}
function iconSheet(g,w,h,v){const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#283250');gr.addColorStop(1,'#3b2f55');g.fillStyle=gr;g.fillRect(0,0,w,h);
  iconArt(g,60,100,400,v);iconArt(g,560,130,130,v);iconArt(g,601,390,48,v);
  g.fillStyle='#fff';g.font='600 16px Inter,sans-serif';g.textAlign='center';g.fillText('Big',260,540);g.fillText('Home screen size',625,292);g.fillText(NAME,625,316);g.fillText('Tiny',625,470)}
// gameplay sketch into a box
function play(g,x,y,w,h,v,st){st=st||'sand';g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  if(v===1){beach(g,x,y,w,h,0,DAY,.14,.74);chair(g,x+w*.16,y+h*.4,w*.07);umbrella(g,x+w*.3,y+h*.45,w*.085,'#2f8fd0');umbrella(g,x+w*.82,y+h*.42,w*.085,'#f5c63a');chair(g,x+w*.72,y+h*.5,w*.07,'#e2493f');pail(g,x+w*.9,y+h*.62,w*.025);
    hole(g,x+w*.5,y+h*.62,w*.13,st,0);umbrella(g,x+w*.585,y+h*.6,w*.085,'#e2493f',-.55);ball(g,x+w*.4,y+h*.5,w*.035,.8);shell(g,x+w*.2,y+h*.66,w*.012);shell(g,x+w*.66,y+h*.86,w*.012,'#fff3dc');ringHud(g,x+w*.08,y+h*.13,w*.04,.7,'4')}
  if(v===2){beach(g,x,y,w,h,0,DAY,.12,.6);hole(g,x+w*.5,y+h*.8,w*.3,st,0,.5);shack(g,x+w*.5,y+h*.72,w*.16,{tilt:.16,coneRot:.5});ball(g,x+w*.14,y+h*.5,w*.03,.2);umbrella(g,x+w*.86,y+h*.5,w*.07,'#f5c63a');ringHud(g,x+w*.08,y+h*.13,w*.04,.95,'6')}
  if(v===3){beach(g,x,y,w,h,0,DAY,0,1);const ys=y+h*.55;[.3,.42,.54,.66,.78].forEach((u,i)=>shell(g,x+w*u,ys+Math.sin(i*2)*h*.05,w*.028,['#f6a6a0','#fff3dc','#f5c63a','#bfe9f2','#f6a6a0'][i]));el(g,x+w*.9,y+h*.3,w*.02,w*.014,'#9aa3a8');el(g,x+w*.6,y+h*.82,w*.02,w*.014,'#9aa3a8');
    hole(g,x+w*.16,ys,w*.07,st,0);g.save();g.globalAlpha=.7;shell(g,x+w*.17,ys+h*.01,w*.018);g.restore();pail(g,x+w*.84,y+h*.74,w*.07,'#2f8fd0');ringHud(g,x+w*.08,y+h*.13,w*.04,.35,'1')}
  g.restore()}
function shelfCard(g,w,h,v){g.fillStyle='#14121c';g.fillRect(0,0,w,h);play(g,0,75,800,450,v);g.fillStyle='#a9a2b8';g.font='600 14px Inter,sans-serif';g.textAlign='center';g.fillText('Card picture area, 16:9',w/2,560)}
function look(g,w,h,st,t){beach(g,0,0,w,h,0,DAY,.12,.66);shell(g,w*.12,h*.36,14);shell(g,w*.22,h*.5,12,'#fff3dc');pail(g,w*.86,h*.36,34,'#2f8fd0');hole(g,w*.45,h*.62,170,st,t||0);ball(g,w*.82,h*.66,52,.6);
  g.fillStyle='#3a2a1c';g.font='600 16px Inter,sans-serif';g.textAlign='left';g.fillText('Shown on sand and boardwalk, beach ball for scale',20,h-18)}
function menu(g,w,h,th){const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,th.top[0]);gr.addColorStop(1,th.top[1]);g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle=th.ink;g.font='700 56px Inter,sans-serif';g.textAlign='center';g.fillText(NAME,w/2,120);
  ['Play','Settings','Records'].forEach((s,i)=>{rr(g,w/2-150,165+i*74,300,58,16,i?th.btn2:th.btn);g.fillStyle=i?th.btn2Ink:th.btnInk;g.font='600 24px Inter,sans-serif';g.fillText(s,w/2,203+i*74)});
  rr(g,60,h-180,w-120,130,18,th.panel);g.fillStyle=th.panelInk;g.textAlign='left';g.font='600 20px Inter,sans-serif';g.fillText('New page: Beach umbrella',90,h-132);g.font='20px Inter,sans-serif';g.fillText('"Shade is a state of mind. Was a state of mind."',90,h-100);g.fillStyle=th.acc;g.font='600 16px Inter,sans-serif';g.textAlign='right';g.fillText('Press A to continue',w-90,h-68)}
function phone(g,w,h,mode){g.fillStyle='#14121c';g.fillRect(0,0,w,h);const pw=300,ph=560,px=70,py=20;rr(g,px-10,py-10,pw+20,ph+20,34,'#0b0a10');g.save();g.beginPath();g.roundRect(px,py,pw,ph,24);g.clip();
  beach(g,px,py,pw,ph,0,DAY,.1,.8);umbrella(g,px+pw*.74,py+ph*.3,34,'#2f8fd0');chair(g,px+pw*.22,py+ph*.26,30);shell(g,px+pw*.3,py+ph*.52,9);shell(g,px+pw*.7,py+ph*.56,9,'#fff3dc');
  const hx=px+pw*.5,hy=py+ph*.42;hole(g,hx,hy,44,'sand',0);ball(g,hx-58,hy-14,17,.5);
  const arrow=(x0,y0,x1,y1,c)=>{g.strokeStyle=c;g.fillStyle=c;g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();const a=Math.atan2(y1-y0,x1-x0);g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-14*Math.cos(a-.5),y1-14*Math.sin(a-.5));g.lineTo(x1-14*Math.cos(a+.5),y1-14*Math.sin(a+.5));g.fill()};
  const thumb=(x,y)=>{el(g,x,y,26,26,'rgba(255,255,255,.55)');g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(x,y,26,0,TAU);g.stroke()};
