const SCENES = {};
const TAU=Math.PI*2,S=Math.sin,C=Math.cos;
function sky(g,w,h,stops){const gr=g.createLinearGradient(0,0,0,h);stops.forEach(([p,c])=>gr.addColorStop(p,c));g.fillStyle=gr;g.fillRect(0,0,w,h)}

function rnd(n){let a=n*9301+49297;return()=>((a=(a*9301+49297)%233280)/233280)}
function stars(g,w,h,t,n,seed){const r=rnd(seed);for(let i=0;i<n;i++){const x=r()*w,y=r()*h*0.55,a=0.3+0.5*(0.5+0.5*S(t*1.5+i));g.fillStyle=`rgba(255,248,220,${a})`;g.fillRect(x,y,1.5,1.5)}}

 poly(g,[[w*0.18,h*0.3],[w*0.22,h*0.36],[w*0.15,h*0.35]],'#eef');poly(g,[[w*0.5,h*0.22],[w*0.55,h*0.3],[w*0.46,h*0.3]],'#eef')}

 for(let i=0;i<60;i++){const x=r()*w,y=h*0.8+r()*h*0.2,c=['#ffd36e','#f28fb0','#fff','#b9a2ff'][i%4],sx=sway?S(t*2+x*0.05)*3:0;g.strokeStyle='#3f6b33';g.beginPath();g.moveTo(x,y+6);g.lineTo(x+sx,y);g.stroke();g.fillStyle=c;g.fillRect(x+sx-1.5,y-1.5,3,3)}
 g.fillStyle='#4a3424';g.fillRect(w*0.8,h*0.6,4,h*0.25);g.fillRect(w*0.8-14,h*0.63,28,6);glow(g,w*0.8+2,h*0.6,26,'rgba(255,200,110,0.7)');g.fillStyle='#ffd88a';g.fillRect(w*0.8-3,h*0.58,10,9)}
SCENES.blg_clouds=(g,t,w,h)=>{const d=0.5+0.5*S(t*TAU/12);peaksBase(g,w,h,d);for(let i=0;i<6;i++){const x=((t*14+i*120)%(w+200))-100;cloud(g,x,h*0.56+(i%2)*10,22+(i%3)*8,0.85)}poly(g,[[0,h*0.6],[w,h*0.6],[w,h*0.68],[0,h*0.68]],'rgba(255,236,230,0.6)');meadow(g,w,h,t,false)};

 px(g,w*0.15,h*0.15,0,'#000');g.fillStyle='#f3efc8';g.fillRect(w*0.13,h*0.1,18,18);g.fillStyle='#151338';g.fillRect(w*0.13+6,h*0.1-3,18,18);
 for(let x=0;x<w;x+=6){const y1=h*0.62+S(x*0.012)*18,y2=h*0.78+S(x*0.02+1)*10;g.fillStyle='#2b4a3a';g.fillRect(x,y1,6,h);g.fillStyle='#3d6b47';g.fillRect(x,y2,6,h)}
 g.fillStyle='#2a1c14';g.fillRect(w*0.55,h*0.42,6,h*0.36);g.fillStyle='#ffd27a';g.fillRect(w*0.55-6,h*0.38,18,12);
 g.fillStyle='#7a4a22';g.fillRect(w*0.55-28,h*0.74,30,18);g.fillStyle='#c98a3a';g.fillRect(w*0.55-28,h*0.74,30,5);g.fillStyle='#ffd34d';g.fillRect(w*0.55-15,h*0.78,4,5)}
SCENES.ph_fireflies=(g,t,w,h)=>{pixelBase(g,w,h,t);glow(g,w*0.55+3,h*0.44,70,'rgba(255,210,120,0.35)');for(let i=0;i<14;i++){const p=((t/8+i/14)%1),a=p*TAU*2+i,r=6+p*30;const x=w*0.55-13+C(a)*r,y=h*0.76-p*h*0.34;px(g,x,y,3,`rgba(255,240,140,${1-p*0.6})`)}};
SCENES.ph_chest=(g,t,w,h)=>{pixelBase(g,w,h,t);glow(g,w*0.55+3,h*0.44,60,'rgba(255,210,120,0.3)');const o=Math.max(0,S(t*TAU/6));glow(g,w*0.55-13,h*0.74,20+o*40,`rgba(255,215,90,${0.25+o*0.5})`);g.fillStyle='#c98a3a';g.fillRect(w*0.55-28,h*0.74-o*8,30,5);for(let i=0;i<8;i++){const q=((t*0.6+i/8)%1);px(g,w*0.55-26+i*4+S(t+i)*4,h*0.73-q*40*o,3,`rgba(255,250,180,${o*(1-q)})`)}};
SCENES.ph_stars=(g,t,w,h)=>{pixelBase(g,w,h,t);glow(g,w*0.55+3,h*0.44,60,'rgba(255,210,120,0.3)');for(let k=0;k<2;k++){const p=((t+k*3.5)%7)/2.2;if(p<1){const x0=w*(0.95-k*0.3),y0=h*(0.05+k*0.08);for(let j=0;j<8;j++)px(g,x0-p*w*0.5+j*6,y0+p*h*0.25-j*3,3,`rgba(255,255,255,${(1-j/8)*(1-p)})`)}}};
// ---------- Home by Dusk: cottage window at dusk ----------
function cottage(g,w,h,t,flick){sky(g,w,h,[[0,'#2d3561'],[0.5,'#c06c84'],[1,'#f8b195']]);glow(g,w*0.3,h*0.55,w*0.3,'rgba(255,180,120,0.35)');
 const pine=(x,b,s,c)=>poly(g,[[x,b-s*2.2],[x-s*0.6,b],[x+s*0.6,b]],c);for(let i=0;i<9;i++)pine(i*w/8,h*0.75,30+(i%3)*10,'#3a2d4f');
 poly(g,[[0,h*0.78],[w,h*0.74],[w,h],[0,h]],'#2a2338');g.fillStyle='#4b3a3a';g.fillRect(w*0.45,h*0.5,w*0.22,h*0.28);poly(g,[[w*0.42,h*0.52],[w*0.56,h*0.36],[w*0.7,h*0.52]],'#6b3e3e');g.fillStyle='#3a2b2b';g.fillRect(w*0.62,h*0.36,12,h*0.12);
 const f=flick?0.85+0.15*S(t*9)*S(t*4.3):1;glow(g,w*0.53,h*0.62,50,`rgba(255,190,90,${0.5*f})`);g.fillStyle=`rgba(255,${200+30*f|0},120,1)`;g.fillRect(w*0.5,h*0.58,22,18);g.fillStyle='#4b3a3a';g.fillRect(w*0.5+10,h*0.58,2,18);g.fillRect(w*0.5,h*0.58+8,22,2)}
SCENES.hbd_smoke=(g,t,w,h)=>{cottage(g,w,h,t,true);for(let i=0;i<12;i++){const p=((t/9+i/12)%1),x=w*0.62+6+S(p*6+t*0.6)*14+p*w*0.25,y=h*0.35-p*h*0.33,r=5+p*16;g.fillStyle=`rgba(225,215,230,${0.45*(1-p)})`;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}};
SCENES.hbd_birds=(g,t,w,h)=>{cottage(g,w,h,t,true);for(let i=0;i<7;i++){const p=((t/10+i*0.05)%1),x=-20+p*(w+40),y=h*0.18+S(p*4+i)*8+(i%3)*8+i*2,fl=S(t*10+i)*4;g.strokeStyle='#1d1830';g.lineWidth=1.5;g.beginPath();g.moveTo(x-6,y-fl);g.lineTo(x,y);g.lineTo(x+6,y-fl);g.stroke()}};
SCENES.hbd_fireflies=(g,t,w,h)=>{cottage(g,w,h,t,true);for(let i=0;i<22;i++){const x=(i*53%w)+S(t*0.7+i)*20,y=h*0.55+(i*37%(h*0.4))+C(t*0.9+i*2)*12,a=0.4+0.6*(0.5+0.5*S(t*2+i));glow(g,x,y,8,`rgba(220,255,140,${a*0.5})`);g.fillStyle=`rgba(240,255,170,${a})`;g.fillRect(x-1,y-1,2.5,2.5)}};

 poly(g,[[0,h*0.85],[w*0.3,h*0.8],[w*0.6,h*0.86],[w,h*0.8],[w,h],[0,h]],'#c9b98a');g.fillStyle='#2f5f6e';g.fillRect(w*0.42,h*0.45,w*0.16,h*0.38);poly(g,[[w*0.4,h*0.46],[w*0.5,h*0.3],[w*0.6,h*0.46]],'#3d7584');glow(g,w*0.5,h*0.55,30,'rgba(255,240,170,0.5)');g.fillStyle='#ffe9a0';g.fillRect(w*0.5-5,h*0.52,10,12)}

const $=s=>document.querySelector(s), picks={};
$('#title').textContent=DECISION.title;$('#intro').textContent=DECISION.intro;$('#note').textContent=DECISION.note;
for(const q of DECISION.questions){
  const sec=document.createElement('section');
  sec.innerHTML=`<h2></h2><p class="mute"></p><div class="grid"></div><textarea rows="2" placeholder="Notes for this one (optional)"></textarea>`;
  sec.querySelector('h2').textContent=q.name;sec.querySelector('p').textContent=q.sub||'';
  q.options.forEach((o,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="opt">Option ${String.fromCharCode(65+i)}${o.rec?'<span class="rec">Recommended</span>':''}</div><h3></h3>`;
    c.querySelector('h3').textContent=o.title;
    for(const m of (o.meta||[])){const d=document.createElement('div');d.className='meta';d.textContent=m;c.appendChild(d)}
    const md=o.media||{};
    if(md.img){const e=document.createElement('img');e.src=md.img;e.alt=o.title;c.appendChild(e)}
    if(md.video){const e=document.createElement('video');e.src=md.video;e.controls=true;e.muted=true;e.loop=true;c.appendChild(e)}
    if(md.draw&&SCENES[md.draw]){const e=document.createElement('canvas');e.width=800;e.height=600;e.style.cssText='width:100%;max-width:800px;aspect-ratio:4/3;border-radius:10px;margin:8px 0;background:#000;display:block';e.dataset.draw=md.draw;c.appendChild(e)}
    if(md.audio){const e=document.createElement('audio');e.src=md.audio;e.controls=true;e.preload='none';c.appendChild(e)}
    const b=document.createElement('button');b.className='pick';b.textContent='Pick this one';c.appendChild(b);
    b.onclick=()=>{sec.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');picks[q.id]={q:q.name,o:o.title};draw()};
    sec.querySelector('.grid').appendChild(c)});
  sec.querySelector('textarea').oninput=e=>{(picks[q.id]=picks[q.id]||{q:q.name,o:''}).n=e.target.value;draw()};
  $('#main').appendChild(sec)}
const cvs=[...document.querySelectorAll('canvas[data-draw]')],seen=new Set();
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting?seen.add(x.target):seen.delete(x.target)));cvs.forEach(c=>io.observe(c));
(function loop(ms){for(const c of seen){const g=c.getContext('2d');g.save();SCENES[c.dataset.draw](g,ms/1000,c.width,c.height);g.restore()}requestAnimationFrame(loop)})(0);
document.addEventListener('play',e=>{document.querySelectorAll('audio,video').forEach(o=>{if(o!==e.target)o.pause()})},true);
function text(){return DECISION.label+': '+DECISION.questions.filter(q=>picks[q.id]).map(q=>{const p=picks[q.id];return q.name+': '+(p.o||'no pick')+(p.n?' ('+p.n.trim()+')':'')}).join('. ')+'.'}
function draw(){const n=DECISION.questions.filter(q=>picks[q.id]&&picks[q.id].o).length;$('#sum').textContent=n?`${n} of ${DECISION.questions.length} picked. `+text():'No picks yet.'}
$('#copy').onclick=async e=>{try{await navigator.clipboard.writeText(text());e.target.textContent='Copied'}catch(err){e.target.textContent='Select the text to copy'}setTimeout(()=>e.target.textContent='Copy my picks',1800)};
</script></body></html>
