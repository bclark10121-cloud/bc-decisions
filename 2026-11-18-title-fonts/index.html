<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start screen titles: placement and fonts</title>
<!-- Decision page (G0.16), 2026-11-18. Every font ships beside this page in fonts/. Nothing loads from other sites. -->

<style>
:root{--bg:#14121c;--card:#1f1c2b;--ink:#f1ece2;--mute:#a9a2b8;--acc:#f2b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main{max-width:none;margin:0;padding:0 28px}header{padding-top:28px}main{padding-bottom:130px}
h1{font:700 28px Georgia,serif;margin:0 0 6px}h2{font:700 22px Georgia,serif;margin:34px 0 0}
.mute{color:var(--mute)}.note{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--mute);font-size:13px;max-width:1100px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(832px,100%),832px));justify-content:start;gap:16px;margin-top:10px}
.card{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px}.card.on{border-color:var(--acc)}
.opt{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
h3{margin:2px 0 4px;font-size:17px}.meta{color:var(--mute);font-size:13px}
.rec{display:inline-block;background:#2e2a40;color:var(--acc);font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px}
button{font:600 14px system-ui,sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#2e2a40;color:var(--ink)}
.card.on .pick{background:var(--acc);color:#1b1608}
textarea{width:100%;max-width:1100px;margin-top:10px;background:var(--card);color:var(--ink);border:1px solid #2e2a40;border-radius:10px;padding:10px;font:14px system-ui,sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0c13ee;border-top:1px solid #2e2a40;padding:12px 20px}
.bar div{margin:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#sum{flex:1;color:var(--mute);font-size:13px}#copy{background:var(--acc);color:#1b1608}

/* ---------- preview stage: 800 x 600, everything sized in container units ---------- */
.stage{position:relative;width:100%;max-width:800px;aspect-ratio:4/3;margin:8px 0;border-radius:10px;overflow:hidden;container-type:inline-size;background:#000}
.sc,.sc *{position:absolute}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:5}
.sky{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:2cqw 0}
.ttl{white-space:nowrap;line-height:1.05;text-align:center;font-size:11cqw;text-shadow:0 0 2.2cqw var(--glow),0 0 .6cqw rgba(0,0,0,.6),0 .35cqw 0 rgba(0,0,0,.45)}
.tag{font:600 2.1cqw system-ui,sans-serif;letter-spacing:.35cqw;text-transform:uppercase;color:#f4ecdc;margin-top:2.2cqw;text-shadow:0 .2cqw .5cqw rgba(0,0,0,.8)}
.keys{font:500 1.75cqw system-ui,sans-serif;color:#efe6d6;margin-bottom:1.3cqw;text-shadow:0 .15cqw .4cqw #000}
.btn{width:46cqw;height:6.4cqw;border-radius:1.4cqw;display:flex;align-items:center;justify-content:center;font:600 2.5cqw system-ui,sans-serif;margin-bottom:1.3cqw;background:#c39143;color:#24180c;border:.25cqw solid #e8c27a}
.btn.ghost{background:rgba(10,10,20,.55);color:#f2ead8;border-color:rgba(255,255,255,.6)}
.ver{font:500 1.5cqw system-ui,sans-serif;color:#cfc6b6;margin:.4cqw 0 1.6cqw;opacity:.8}
.stars{inset:0;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 33% 9%,#fff 98%,transparent),radial-gradient(1.4px 1.4px at 58% 22%,#fff 98%,transparent),radial-gradient(1px 1px at 77% 12%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 88% 31%,#fff 98%,transparent),radial-gradient(1px 1px at 22% 38%,#fff 98%,transparent),radial-gradient(1px 1px at 47% 41%,#fff 98%,transparent),radial-gradient(1.3px 1.3px at 6% 52%,#fff 98%,transparent),radial-gradient(1px 1px at 69% 47%,#fff 98%,transparent),radial-gradient(1px 1px at 94% 6%,#fff 98%,transparent);opacity:.85}

/* layout question: phone portrait + landscape pair */
.pair{position:relative;width:100%;max-width:800px;aspect-ratio:4/3;margin:8px 0;border-radius:10px;background:#0b0a12;display:flex;gap:4%;align-items:center;justify-content:center;padding:3%}
.pair .lab{position:absolute;top:2%;font:600 12px system-ui;color:#a9a2b8}
.phone{height:92%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;position:relative;container-type:inline-size;border:3px solid #2b2838}
.land{width:52%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;container-type:inline-size;border:3px solid #2b2838}
.phone .ttl{font-size:14cqw}.phone .tag{font-size:3.6cqw;letter-spacing:.5cqw}.phone .btn{width:78cqw;height:12cqw;font-size:4.6cqw;border-radius:2.6cqw;margin-bottom:2.6cqw}.phone .keys{font-size:3.2cqw;margin-bottom:2.6cqw}.phone .ver{font-size:3cqw;margin-bottom:4cqw}
.land .ttl{font-size:8.5cqw}.land .tag{font-size:1.6cqw}.land .btn{width:32cqw;height:4.4cqw;font-size:1.8cqw;margin-bottom:.9cqw}.land .keys{font-size:1.3cqw}.land .ver{font-size:1.2cqw}
.today .sky{justify-content:flex-start;padding-top:6%}.today .ttl{font-weight:700;letter-spacing:.6cqw}.today .ttl{font-size:9cqw!important}.today .phone .ttl{font-size:10.5cqw!important}.today .land .ttl{font-size:5.2cqw!important}
.center .ui{justify-content:flex-start}.center .sky{flex:none;height:100%;position:absolute;inset:0}.center .low{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.center .phone .low{bottom:0}.center .land .sky{width:55%}.center .land .low{left:auto;right:3%;width:40%;bottom:50%;transform:translateY(50%)}
.mid .land .sky{width:55%}.mid .land .ui{flex-direction:row}.mid .land .low{width:42%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.low{display:flex;flex-direction:column;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes sweep{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(38deg)}}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-40cqw);opacity:0}}
@keyframes wave{0%,100%{transform:skewY(-4deg) translateX(-2%)}50%{transform:skewY(3deg) translateX(2%)}}
@keyframes drift{0%,100%{transform:translateX(-3%)}50%{transform:translateX(3%)}}

function ui(k,font,extra){const g=GAME[k];return `<div class="ui"><div class="sky"><div class="ttl" style="font-family:'${font}';color:${g.c};--glow:${g.g};${extra||''}">${g.n}</div><div class="tag">${g.t}</div></div><div class="low"><div class="keys">Left stick to move. A to pick up. Menu for options.</div><div class="btn">Continue</div><div class="btn">Play</div><div class="btn ghost">Settings</div><div class="ver">Version 0.20.0</div></div></div>`}
function stage(k,font,extra){return `<div class="stage">${`<div class="sc" style="inset:0">${S[k]}</div>`}${ui(k,font,extra)}</div>`}
function pair(cls,font){return `<div class="pair ${cls}"><div class="phone"><div class="sc" style="inset:0">${S.pixel}</div>${ui('pixel',font)}</div><div class="land"><div class="sc" style="inset:0">${S.pixel}</div>${ui('pixel',font)}</div></div>`}

const $=s=>document.querySelector(s),picks={};
$('#title').textContent=DECISION.title;$('#intro').textContent=DECISION.intro;$('#note').textContent=DECISION.note;
for(const q of DECISION.questions){
 const sec=document.createElement('section');
 sec.innerHTML=`<h2></h2><p class="mute"></p><div class="grid"></div><textarea rows="2" placeholder="Notes for this one (optional)"></textarea>`;
 sec.querySelector('h2').textContent=q.name;sec.querySelector('p').textContent=q.sub||'';
 q.options.forEach((o,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="opt">Option ${String.fromCharCode(65+i)}${o.rec?'<span class="rec">Recommended</span>':''}</div><h3></h3>`;
  c.querySelector('h3').textContent=o.title;
  for(const m of (o.meta||[])){const d=document.createElement('div');d.className='meta';d.textContent=m;c.appendChild(d)}
  const box=document.createElement('div');box.innerHTML=o.html||stage(q.id,o.font,o.extra);c.appendChild(box);
  const b=document.createElement('button');b.className='pick';b.textContent='Pick this one';c.appendChild(b);
  b.onclick=()=>{sec.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');picks[q.id]=Object.assign(picks[q.id]||{},{q:q.name.replace(/^\d+\.\s*/,''),o:o.title});draw()};
  sec.querySelector('.grid').appendChild(c)});
 sec.querySelector('textarea').oninput=e=>{(picks[q.id]=picks[q.id]||{q:q.name.replace(/^\d+\.\s*/,''),o:''}).n=e.target.value;draw()};
 $('#main').appendChild(sec)}
/* shrink any title that runs past 86% of its screen so long names stay on one line */
function fit(){document.querySelectorAll('.ttl').forEach(t=>{const w=t.parentElement.clientWidth*.86;let s=parseFloat(getComputedStyle(t).fontSize),n=0;while(t.scrollWidth>w&&n++<40){s*=.95;t.style.fontSize=s+'px'}})}
document.fonts.ready.then(fit);
function text(){return DECISION.label+': '+DECISION.questions.filter(q=>picks[q.id]).map(q=>{const p=picks[q.id];return q.name.replace(/^\d+\.\s*/,'')+': '+(p.o||'no pick')+(p.n?' ('+p.n.trim()+')':'')}).join('. ')+'.'}
function draw(){const n=DECISION.questions.filter(q=>picks[q.id]&&picks[q.id].o).length;$('#sum').textContent=n?`${n} of ${DECISION.questions.length} picked. `+text():'No picks yet.'}
$('#copy').onclick=async e=>{try{await navigator.clipboard.writeText(text());e.target.textContent='Copied'}catch(err){e.target.textContent='Select the text to copy'}setTimeout(()=>e.target.textContent='Copy my picks',1800)};
</script></body></html>
