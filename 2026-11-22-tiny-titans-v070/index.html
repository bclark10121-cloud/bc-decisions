<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Titans Football v0.7.0 picks</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<!-- Decision page (G0.16). Copy this folder, fill in DECISION below, put previews beside it (audio/, img/, video/),
     push it to bclark10121-cloud/bc-decisions as <date>-<topic>/index.html, add it to that repo's index.html
     open https://bclark10121-cloud.github.io/bc-decisions/<date>-<topic>/ in a NEW full-width browser tab
     and put that full link in the reply. Never as a Claude artifact. BC picks, presses Copy my picks and pastes the text in chat.
     A new game's look and sound page uses the sections in NEW_GAME_LOOK_AND_SOUND.md, APK icon first (BC, 2026-11-20). -->
<style>
:root{--bg:#14121c;--card:#1f1c2b;--ink:#f1ece2;--mute:#a9a2b8;--acc:#f2b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header,main{max-width:none;margin:0;padding:0 28px}header{padding-top:28px}main{padding-bottom:130px}
h1{font:600 28px Fraunces,serif;margin:0 0 6px}h2{font:600 21px Fraunces,serif;margin:28px 0 0}
.mute{color:var(--mute)}.note{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:6px}
.card{background:var(--card);border:2px solid transparent;border-radius:10px;padding:9px}.card.on{border-color:var(--acc)}
.opt{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
h3{margin:2px 0 2px;font-size:14px}.meta{color:var(--mute);font-size:12px;line-height:1.35}
.card img,.card video{width:100%;border-radius:7px;margin:5px 0}audio{width:100%;margin:10px 0 8px}
.rec{display:inline-block;background:#2e2a40;color:var(--acc);font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#2e2a40;color:var(--ink)}
.card.on .pick{background:var(--acc);color:#1b1608}
textarea{width:100%;margin-top:10px;background:var(--card);color:var(--ink);border:1px solid #2e2a40;border-radius:10px;padding:10px;font:14px Inter,sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0c13ee;border-top:1px solid #2e2a40;padding:12px 20px}
.bar div{margin:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#sum{flex:1;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#copy{background:var(--acc);color:#1b1608}.spd.on{background:#4a4368;color:var(--acc)}.live{position:relative}.live:after{content:'\25CF  Moving preview';position:absolute;left:10px;top:18px;font:600 11px Inter,sans-serif;color:#fff;background:#0009;border-radius:6px;padding:2px 7px}
</style></head><body>
<header><h1 id="title"></h1><p class="mute" id="intro"></p><div class="note" id="note"></div></header>
<main id="main"></main>
<div class="bar"><div><span id="sum">No picks yet.</span><span class="mute" style="font-size:13px">Preview speed</span><button class="spd" data-s="1">1x</button><button class="spd on" data-s="2">2x</button><button class="spd" data-s="4">4x</button><button id="copy">Copy my picks</button></div></div>
<script>
// Fill this in. Each question gets one pick. media: {audio|img|video: "relative/path"} or {draw: "name"} for a live canvas
// sketch drawn by SCENES[name](ctx, t, w, h). rec: true marks Claude's recommendation.
// Sketches only. The picked look is built properly in the game.
function field(g,w,h){g.fillStyle='#2f7d3b';g.fillRect(0,0,w,h);g.strokeStyle='#ffffff55';g.lineWidth=2;for(let i=0;i<6;i++){const y=h-20-i*50;g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}}
function guy(g,x,y,s,t,c){const b=Math.sin(t*9)*2*s,l=Math.sin(t*9)*7*s;
  g.fillStyle='#0004';g.beginPath();g.ellipse(x,y+30*s,16*s,5*s,0,0,7);g.fill();
  g.fillStyle='#2a2a2e';g.fillRect(x-9*s+l*.4,y+24*s,7*s,6*s);g.fillRect(x+2*s-l*.4,y+24*s,7*s,6*s);
  g.fillStyle=c.pants;g.fillRect(x-9*s,y+8*s+b,8*s,17*s);g.fillRect(x+1*s,y+8*s+b,8*s,17*s);
  g.fillStyle=c.jersey;g.beginPath();g.roundRect(x-17*s,y-14*s+b,34*s,26*s,8*s);g.fill();
  g.fillStyle=c.num||'#fff';g.font=`700 ${13*s}px Inter,sans-serif`;g.textAlign='center';g.fillText(c.n||'7',x,y+4*s+b);
  g.fillStyle=c.helmet;g.beginPath();g.arc(x,y-24*s+b,13*s,0,7);g.fill();
  g.strokeStyle='#2a2a2e';g.lineWidth=2*s;g.beginPath();g.moveTo(x-7*s,y-19*s+b);g.lineTo(x+7*s,y-19*s+b);g.moveTo(x-6*s,y-15*s+b);g.lineTo(x+6*s,y-15*s+b);g.stroke()}
function team(c){return (g,t,w,h)=>{field(g,w,h);guy(g,w*.3,h*.55,2.2,t,c);guy(g,w*.62,h*.5,1.5,t+.4,Object.assign({},c,{n:'24'}));guy(g,w*.82,h*.62,1.5,t+.8,Object.assign({},c,{n:'88'}))}}
const HOME={jersey:'#1f6f5c',helmet:'#d9c27a',pants:'#f2efe6'};
function arcPts(w,h,k){const a={x:w*.2,y:h*.82},b={x:w*.74,y:h*.3},p=[];for(let i=0;i<=24;i++){const u=i/24*k;p.push({x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u-Math.sin(u*Math.PI)*70})}return p}
function aim(style){return (g,t,w,h)=>{field(g,w,h);const k=Math.min(1,(t%3)/1.6),p=arcPts(w,h,k),e=p[p.length-1],full=arcPts(w,h,1),L=full[24];
  guy(g,w*.2,h*.74,1.3,0,HOME);guy(g,L.x+26-18*k,L.y+8,1.2,t,Object.assign({},HOME,{n:'81'}));
  if(style==='dots'){g.fillStyle='#fff';p.forEach((q,i)=>{if(i%2==0){g.beginPath();g.arc(q.x,q.y,3.2,0,7);g.fill()}})}
  if(style==='ribbon'){for(let i=1;i<p.length;i++){g.strokeStyle=`rgba(255,214,90,${.25+.75*i/p.length})`;g.lineWidth=2+5*i/p.length;g.beginPath();g.moveTo(p[i-1].x,p[i-1].y);g.lineTo(p[i].x,p[i].y);g.stroke()}}
  if(style==='ring'){g.strokeStyle='#ffffff66';g.setLineDash([4,6]);g.beginPath();g.moveTo(w*.2,h*.82);g.lineTo(e.x,e.y);g.stroke();g.setLineDash([])}
  const lx=style==='ring'?w*.2+(L.x-w*.2)*k:e.x, ly=style==='ring'?h*.82+(L.y-h*.82)*k:(k<1?e.y:L.y);
  g.strokeStyle='#ffd65a';g.lineWidth=3;g.beginPath();g.ellipse(style==='ring'?lx:full[Math.round(24*k)].x,style==='ring'?ly:(k<1?h*.82+(L.y-h*.82)*k:L.y),16+Math.sin(t*6)*2,7,0,0,7);g.stroke()}}
function star(style){return (g,t,w,h)=>{field(g,w,h);const x=w*.5,y=h*.62,c=Object.assign({},HOME,{n:'12'});
  guy(g,w*.84,h*.66,1.3,t+.5,Object.assign({},HOME,{n:'64'}));
  if(style==='ring'){g.strokeStyle='#ffd65a';g.lineWidth=5;g.beginPath();g.ellipse(x,y+52,34+Math.sin(t*5)*3,10,0,0,7);g.stroke()}
  if(style==='num'){c.num='#ffd65a'}
  guy(g,x,y,1.7,t,c);
  if(style==='icon'){const yy=y-80+Math.sin(t*5)*3;g.fillStyle='#ffd65a';g.beginPath();for(let i=0;i<10;i++){const r=i%2?6:14,a=-Math.PI/2+i*Math.PI/5;g.lineTo(x+Math.cos(a)*r,yy+Math.sin(a)*r)}g.fill()}
  g.fillStyle='#fff';g.font='600 14px Inter,sans-serif';g.textAlign='center';g.fillText('Star',x,h-8);g.fillText('Other',w*.84,h-8)}}
const T=(j,hm,p)=>({jersey:j,helmet:hm,pants:p});
const SCENES = {
  scorp:team(T('#5a2d8c','#f0c23a','#f4f1ea')), sting:team(T('#4b3fa8','#3fd0c9','#3a3d46')),
  fox:team(T('#e8742a','#f6f4ee','#22304f')), coy:team(T('#b5622b','#e3cfa4','#5a3d28')),
  moose:team(T('#6e1f2b','#efe6cf','#efe6cf')), badg:team(T('#1d1d1f','#f4f4f4','#b9bcc2')),
  heron:team(T('#5f8fa6','#f3d34a','#f4f1ea')), lob:team(T('#f2c230','#c8322b','#f4f1ea')), jack:team(T('#8cc63f','#1f4d2b','#f4f1ea')),
  dots:aim('dots'), ribbon:aim('ribbon'), ring:aim('ring'), sring:star('ring'), sicon:star('icon'), snum:star('num')
};
const CHK="Name check: one web search found no team with this exact name.";
const DECISION = {
  title: "Tiny Titans Football v0.7.0: new teams, aim arc, star marker and names",
  intro: "Ten picks for the v0.7.0 build. The league grows from 4 teams to 8, so four new fictional teams join the Otters, Comets, Rattlers and Yetis.",
  note: "Every preview is a quick sketch that moves, not final art. The picked look is built properly in the game's low-poly style. The build has started on pieces that do not need these picks. A Recommended pick is Claude's suggestion, nothing more. After you pick, press Copy my picks and paste the text in the chat.",
  label: "Tiny Titans v0.7.0 picks",
  questions: [
    { id:"t1", name:"New team 1: purple", sub:"No team wears purple today.",
      options:[ {title:"Dune City Scorpions", meta:["Purple jersey, gold helmet, white pants",CHK], media:{draw:"scorp"}, rec:true},
                {title:"Stormwater Stingrays", meta:["Violet jersey, aqua helmet, charcoal pants",CHK], media:{draw:"sting"}} ] },
    { id:"t2", name:"New team 2: orange", sub:"The Comets have an orange helmet. No team has an orange jersey.",
      options:[ {title:"Glacier Point Foxes", meta:["Orange jersey, white helmet, navy pants",CHK], media:{draw:"fox"}, rec:true},
                {title:"Copper Canyon Coyotes", meta:["Copper jersey, tan helmet, brown pants",CHK], media:{draw:"coy"}} ] },
    { id:"t3", name:"New team 3: dark", sub:"A dark jersey that is not the Rattlers' red.",
      options:[ {title:"Maple Hollow Moose", meta:["Maroon jersey, cream helmet, cream pants",CHK], media:{draw:"moose"}, rec:true},
                {title:"Pine Ridge Badgers", meta:["Black jersey, white helmet, silver pants",CHK], media:{draw:"badg"}} ] },
    { id:"t4", name:"New team 4: bright", sub:"One bright team so all 8 read apart on a phone.",
      options:[ {title:"Lantern Bay Lobsters", meta:["Yellow jersey, red helmet, white pants",CHK], media:{draw:"lob"}, rec:true},
                {title:"Bayou Bend Herons", meta:["Slate blue jersey, yellow helmet, white pants",CHK], media:{draw:"heron"}},
                {title:"Juniper Flats Jackrabbits", meta:["Lime jersey, dark green helmet, white pants",CHK], media:{draw:"jack"}} ] },
    { id:"arc", name:"Aim passing: the arc", sub:"What you see while you drag to aim a throw (idea 16).",
      options:[ {title:"Dotted arc and landing ring", meta:["White dots show the path. A gold ring shows where the ball lands.","Easiest to read on grass."], media:{draw:"dots"}, rec:true},
                {title:"Gold ribbon and landing ring", meta:["A solid ribbon that gets brighter toward the landing spot.","Bolder. Hides a little more of the field."], media:{draw:"ribbon"}},
                {title:"Landing ring only", meta:["A faint line on the ground and the gold ring. No arc in the air.","Cleanest screen. Harder to judge a lob."], media:{draw:"ring"}} ] },
    { id:"star", name:"Star player marker", sub:"How a star stands out from the other players on the field in Career mode (idea 21).",
      options:[ {title:"Gold ring under the player", meta:["Flat on the grass, like the yellow control ring.","Never covers a player."], media:{draw:"sring"}, rec:true},
                {title:"Gold star over the helmet", meta:["A small star that floats above the player.","Easy to spot. Adds clutter in a crowd."], media:{draw:"sicon"}},
                {title:"Gold jersey number", meta:["The number turns gold. Nothing else is added.","Subtle. Hard to see on a phone."], media:{draw:"snum"}} ] },
    { id:"cur", name:"Currency name", sub:"What you earn for wins in Career mode (idea 22).",
      options:[ {title:"Titan Tokens", meta:["Ties to the game's name."], rec:true}, {title:"Game Balls", meta:["A football term for a reward."]}, {title:"Trophy Coins", meta:["Plain and clear."]} ] },
    { id:"mode", name:"The new long mode's name", sub:"Many seasons with one team (ideas 20 to 27).",
      options:[ {title:"Career", meta:["Clear to a new player."], rec:true}, {title:"Dynasty", meta:["A common football game term."]}, {title:"Franchise", meta:["A common football game term."]} ] },
    { id:"card", name:"Between-game cards name", sub:"The one-tap choices after a Career game (idea 23).",
      options:[ {title:"Coach's call", meta:["You are the coach. You make the call."], rec:true}, {title:"Sideline call", meta:[]}, {title:"Locker room talk", meta:[]} ] },
    { id:"quick", name:"The short mode's name", sub:"Offense only, about 5 minutes (idea 19).",
      options:[ {title:"Quick game", meta:["Says what it is."], rec:true}, {title:"Offense only", meta:["Says how it plays."]}, {title:"Five-minute game", meta:["Says how long it takes."]} ] }
  ]
};
const $=s=>document.querySelector(s), picks={};
$('#title').textContent=DECISION.title;$('#intro').textContent=DECISION.intro;$('#note').textContent=DECISION.note;
for(const q of DECISION.questions){
  const sec=document.createElement('section');
  sec.innerHTML=`<h2></h2><p class="mute"></p><div class="grid"></div><textarea rows="1" placeholder="Notes for this one (optional)"></textarea>`;
  sec.querySelector('h2').textContent=q.name;sec.querySelector('p').textContent=q.sub||'';
  q.options.forEach((o,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="opt">Option ${String.fromCharCode(65+i)}${o.rec?'<span class="rec">Recommended</span>':''}</div><h3></h3>`;
    c.querySelector('h3').textContent=o.title;
    for(const m of (o.meta||[])){const d=document.createElement('div');d.className='meta';d.textContent=m;c.appendChild(d)}
    const md=o.media||{};
    if(md.img){const e=document.createElement('img');e.src=md.img;e.alt=o.title;c.appendChild(e)}
    if(md.video){const e=document.createElement('video');e.src=md.video;e.controls=true;e.muted=true;e.loop=true;c.appendChild(e)}
    if(md.draw&&SCENES[md.draw]){const e=document.createElement('canvas');e.width=480;e.height=270;e.style.cssText='width:100%;aspect-ratio:16/9;border-radius:10px;margin:8px 0;background:#000;display:block';e.dataset.draw=md.draw;const wr=document.createElement('div');wr.className='live';wr.appendChild(e);c.appendChild(wr)}
    if(md.audio){const e=document.createElement('audio');e.src=md.audio;e.controls=true;e.preload='none';c.appendChild(e)}
    const b=document.createElement('button');b.className='pick';b.textContent='Pick this one';c.appendChild(b);
    b.onclick=()=>{sec.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');picks[q.id]={q:q.name,o:o.title};draw()};
    sec.querySelector('.grid').appendChild(c)});
  sec.querySelector('textarea').oninput=e=>{(picks[q.id]=picks[q.id]||{q:q.name,o:''}).n=e.target.value;draw()};
  $('#main').appendChild(sec)}
const cvs=[...document.querySelectorAll('canvas[data-draw]')],seen=new Set();
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting?seen.add(x.target):seen.delete(x.target)));cvs.forEach(c=>io.observe(c));
let speed=2,clock=0,last=0;document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on',x===b))});
(function loop(ms){clock+=Math.min(100,ms-last)/1000*speed;last=ms;for(const c of seen){const g=c.getContext('2d');g.save();SCENES[c.dataset.draw](g,clock,c.width,c.height);g.restore()}requestAnimationFrame(loop)})(0);
document.addEventListener('play',e=>{document.querySelectorAll('audio,video').forEach(o=>{if(o!==e.target)o.pause()})},true);
function text(){return DECISION.label+': '+DECISION.questions.filter(q=>picks[q.id]).map(q=>{const p=picks[q.id];return q.name+': '+(p.o||'no pick')+(p.n?' ('+p.n.trim()+')':'')}).join('. ')+'.'}
function draw(){const n=DECISION.questions.filter(q=>picks[q.id]&&picks[q.id].o).length;$('#sum').textContent=n?`${n} of ${DECISION.questions.length} picked`+(n<DECISION.questions.length?'':'. Press Copy my picks.'):'No picks yet.'}
$('#copy').onclick=async e=>{try{await navigator.clipboard.writeText(text());e.target.textContent='Copied'}catch(err){e.target.textContent='Select the text to copy'}setTimeout(()=>e.target.textContent='Copy my picks',1800)};
</script></body></html>
