<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Updraft Aces Stage 2 picks</title>
<style></style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<!-- Decision page (G0.16). Copy this folder, fill in DECISION below, put previews beside it (audio/, img/, video/),
     push it to bclark10121-cloud/bc-decisions as <date>-<topic>/index.html, add it to that repo's index.html
     open https://bclark10121-cloud.github.io/bc-decisions/<date>-<topic>/ in a NEW full-width browser tab
     and put that full link in the reply. Never as a Claude artifact. BC picks, presses Copy my picks and pastes the text in chat. -->
<style>
:root{--bg:#14121c;--card:#1f1c2b;--ink:#f1ece2;--mute:#a9a2b8;--acc:#f2b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header,main{max-width:none;margin:0;padding:0 28px}header{padding-top:28px}main{padding-bottom:130px}
h1{font:600 28px Fraunces,serif;margin:0 0 6px}h2{font:600 21px Fraunces,serif;margin:28px 0 0}
.mute{color:var(--mute)}.note{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(832px,100%),832px));justify-content:start;gap:16px;margin-top:10px}
.card{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px}.card.on{border-color:var(--acc)}
.opt{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
h3{margin:2px 0 4px;font-size:17px}.meta{color:var(--mute);font-size:13px}
.card img,.card video{width:100%;max-width:800px;border-radius:10px;margin:8px 0}audio{width:100%;margin:10px 0 8px}
.rec{display:inline-block;background:#2e2a40;color:var(--acc);font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#2e2a40;color:var(--ink)}
.card.on .pick{background:var(--acc);color:#1b1608}
textarea{width:100%;margin-top:10px;background:var(--card);color:var(--ink);border:1px solid #2e2a40;border-radius:10px;padding:10px;font:14px Inter,sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0c13ee;border-top:1px solid #2e2a40;padding:12px 20px}
.bar div{margin:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#sum{flex:1;color:var(--mute);font-size:13px}#copy{background:var(--acc);color:#1b1608}.spd.on{background:#4a4368;color:var(--acc)}.live{position:relative}.live:after{content:'\25CF  Moving preview';position:absolute;left:10px;top:18px;font:600 11px Inter,sans-serif;color:#fff;background:#0009;border-radius:6px;padding:2px 7px}
</style></head><body>
<header><h1 id="title"></h1><p class="mute" id="intro"></p><div class="note" id="note"></div></header>
<main id="main"></main>
<div class="bar"><div><span id="sum">No picks yet.</span><span class="mute" style="font-size:13px">Preview speed</span><button class="spd" data-s="1">1x</button><button class="spd on" data-s="2">2x</button><button class="spd" data-s="4">4x</button><button id="copy">Copy my picks</button></div></div>
<script>
// Fill this in. Each question gets one pick. media: {audio|img|video: "relative/path"} or {draw: "name"} for a live canvas
// sketch drawn by SCENES[name](ctx, t, w, h). rec: true marks Claude's recommendation.
const SCENES = {};
const TAU=Math.PI*2;
function grad(g,h,stops){const s=g.createLinearGradient(0,0,0,h);stops.forEach(([o,c])=>s.addColorStop(o,c));return s}
// the twin-engine from above, BC's plane C
function plane(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);
 g.fillStyle='rgba(0,0,0,0.18)';g.beginPath();g.ellipse(14,22,40,14,0,0,TAU);g.fill();
 g.fillStyle='#e8a33a';g.beginPath();g.moveTo(-46,4);g.lineTo(46,4);g.lineTo(42,14);g.lineTo(-42,14);g.closePath();g.fill();
 g.fillStyle='#d9573a';g.fillRect(-26,-6,10,26);g.fillRect(16,-6,10,26);
 g.fillStyle='#f2c46a';g.beginPath();g.ellipse(0,6,9,30,0,0,TAU);g.fill();
 g.fillStyle='#e8a33a';g.fillRect(-16,30,32,7);g.fillStyle='#7fd0f0';g.beginPath();g.ellipse(0,-4,5,8,0,0,TAU);g.fill();
 g.fillStyle='rgba(255,255,255,0.55)';g.fillRect(-30,-9,18,2);g.fillRect(12,-9,18,2);g.restore()}
function shots(g,x,y,t){g.fillStyle='#fff6c8';for(let i=0;i<6;i++){const sy=y-40-((t*500+i*90)%540);g.fillRect(x-22,sy,4,12);g.fillRect(x+18,sy,4,12)}}
function fighter(g,x,y,s,body,trim){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=body;g.beginPath();g.moveTo(0,16);g.lineTo(-6,-10);g.lineTo(6,-10);g.closePath();g.fill();
 g.fillRect(-22,-2,44,8);g.fillStyle=trim;g.fillRect(-22,-2,6,8);g.fillRect(16,-2,6,8);g.fillRect(-9,-14,18,5);g.restore()}
function cloud(g,x,y,r,c){g.fillStyle=c;[[0,0,1],[-.9,.2,.7],[.9,.25,.75],[-.4,-.35,.7],[.45,-.3,.65]].forEach(([dx,dy,k])=>{g.beginPath();g.arc(x+dx*r,y+dy*r,r*k,0,TAU);g.fill()})}
function common(g,t,w,h,body,trim){const py=h*0.78+Math.sin(t*1.3)*14,px=w*0.5+Math.sin(t*0.9)*120;shots(g,px,py,t);
 for(let i=0;i<5;i++){const fx=w*0.5+(i-2)*70,fy=((t*70)%(h+200))-120-Math.abs(i-2)*40;fighter(g,fx,fy,1.4,body,trim)}plane(g,px,py,1.3)}
// A: Amber Canyon. Sunset over red rock mesas, arches and a winding river.
SCENES.a=(g,t,w,h)=>{g.fillStyle='#d98a4e';g.fillRect(0,0,w,h);
 const off=(t*60)%h;for(let k=-1;k<2;k++){const y0=k*h+off;g.fillStyle='#3b8fa8';g.beginPath();g.moveTo(w*0.45,y0);
  for(let i=0;i<=10;i++){const y=y0+i*h/10;g.lineTo(w*0.45+Math.sin(i*0.9+k)*90,y)}for(let i=10;i>=0;i--){const y=y0+i*h/10;g.lineTo(w*0.45+Math.sin(i*0.9+k)*90+60,y)}g.fill()}
 for(let i=0;i<9;i++){const x=(i*173)%w,y=((i*211+t*60)%(h+160))-80,r=40+(i*29)%40;g.fillStyle='#8f3b24';g.beginPath();g.ellipse(x+10,y+12,r,r*0.75,0,0,TAU);g.fill();
  g.fillStyle='#c4583a';g.beginPath();g.ellipse(x,y,r,r*0.75,0,0,TAU);g.fill();g.fillStyle='#e07a4a';g.beginPath();g.ellipse(x-6,y-6,r*0.7,r*0.5,0,0,TAU);g.fill()}
 const ay=((t*60+300)%(h+200))-100;g.strokeStyle='#a8452c';g.lineWidth=22;g.beginPath();g.arc(w*0.2,ay,60,Math.PI,0);g.stroke();
 g.fillStyle='rgba(255,170,90,0.18)';g.fillRect(0,0,w,h);common(g,t,w,h,'#6b7a3a','#2c8a8a')};
// B: Thunderhead Reach. Dark storm clouds, rain, lightning, a gray sea far below.
SCENES.b=(g,t,w,h)=>{g.fillStyle='#3d5560';g.fillRect(0,0,w,h);
 for(let i=0;i<14;i++){const x=(i*157)%w,y=((i*97+t*40)%(h+200))-100;g.fillStyle='rgba(255,255,255,0.25)';g.fillRect(x,y,30,2)}
 for(let i=0;i<8;i++){const x=(i*233)%w,y=((i*181+t*90)%(h+300))-150;cloud(g,x+12,y+14,70,'#26363f');cloud(g,x,y,70,'#5a6f7a');cloud(g,x-10,y-12,46,'#76899a')}
 const f=(t%5);if(f<0.1||(f>0.2&&f<0.26)){g.fillStyle='rgba(230,240,255,0.45)';g.fillRect(0,0,w,h);g.strokeStyle='#fffbe0';g.lineWidth=4;g.beginPath();let x=w*0.7,y=0;g.moveTo(x,y);while(y<h*0.6){x+=(Math.sin(y*13.1)*40);y+=50;g.lineTo(x,y)}g.stroke()}
 g.strokeStyle='rgba(200,220,235,0.4)';g.lineWidth=2;for(let i=0;i<70;i++){const x=(i*61)%w,y=(i*37+t*900)%h;g.beginPath();g.moveTo(x,y);g.lineTo(x-6,y+18);g.stroke()}
 common(g,t,w,h,'#6b7a3a','#2c8a8a')};
// C: Aurora North. Night over a frozen sea, icebergs, green and violet aurora.
SCENES.c=(g,t,w,h)=>{g.fillStyle='#16304a';g.fillRect(0,0,w,h);
 for(let i=0;i<60;i++){g.fillStyle=`rgba(255,255,255,${0.3+0.3*Math.sin(t*2+i)})`;g.fillRect((i*137)%w,((i*53)+t*20)%h,2,2)}
 for(let k=0;k<3;k++){g.fillStyle=['rgba(90,255,170,0.18)','rgba(160,110,255,0.15)','rgba(90,220,255,0.12)'][k];g.beginPath();g.moveTo(0,h*0.2+k*60);
  for(let x=0;x<=w;x+=40)g.lineTo(x,h*0.2+k*60+Math.sin(x*0.012+t*0.8+k)*50);for(let x=w;x>=0;x-=40)g.lineTo(x,h*0.2+k*60+120+Math.sin(x*0.01+t*0.6+k)*40);g.fill()}
 for(let i=0;i<10;i++){const x=(i*191)%w,y=((i*149+t*60)%(h+160))-80,r=26+(i*13)%34;g.fillStyle='#8fb4cc';g.beginPath();g.moveTo(x-r,y+8);g.lineTo(x-r*0.4,y-r*0.6);g.lineTo(x+r*0.6,y-r*0.4);g.lineTo(x+r,y+10);g.closePath();g.fill();
  g.fillStyle='#e8f6ff';g.beginPath();g.moveTo(x-r*0.8,y);g.lineTo(x-r*0.4,y-r*0.6);g.lineTo(x+r*0.6,y-r*0.4);g.lineTo(x+r*0.5,y);g.closePath();g.fill()}
 common(g,t,w,h,'#6b7a3a','#2c8a8a')};
// Enemy previews on a plain sky
function sky(g,w,h){g.fillStyle=grad(g,h,[[0,'#7ec3e8'],[1,'#cfeaf7']]);g.fillRect(0,0,w,h);cloud(g,w*0.2,h*0.25,40,'rgba(255,255,255,0.8)');cloud(g,w*0.8,h*0.6,50,'rgba(255,255,255,0.8)')}
// D: bombers that drop slow flak
SCENES.d=(g,t,w,h)=>{sky(g,w,h);const y=((t*50)%(h+200))-100;for(let k=0;k<2;k++){const x=w*(0.35+k*0.3);g.save();g.translate(x,y);g.fillStyle='#4f5c2c';g.fillRect(-60,-6,120,16);g.fillStyle='#6b7a3a';g.beginPath();g.ellipse(0,0,14,42,0,0,TAU);g.fill();g.fillStyle='#2c8a8a';g.fillRect(-36,-12,10,26);g.fillRect(26,-12,10,26);g.fillRect(-20,30,40,6);g.restore();
  for(let i=0;i<4;i++){const u=((t*0.8+i*0.25+k*0.1)%1);const by=y+30+u*260;g.fillStyle=`rgba(60,60,60,${1-u})`;g.beginPath();g.arc(x,by,6,0,TAU);g.fill();if(u>0.75){g.fillStyle=`rgba(255,180,80,${(1-u)*3})`;for(let j=0;j<8;j++){const a=j*TAU/8;g.beginPath();g.arc(x+Math.cos(a)*(u-0.75)*240,by+Math.sin(a)*(u-0.75)*240,4,0,TAU);g.fill()}}}}
 plane(g,w*0.5+Math.sin(t)*140,h*0.82,1.1)};
// E: balloon mines that drift and pop into a ring
SCENES.e=(g,t,w,h)=>{sky(g,w,h);for(let i=0;i<6;i++){const x=w*(0.12+i*0.15)+Math.sin(t*1.5+i)*20,y=((t*40+i*90)%(h+120))-60;g.strokeStyle='#555';g.lineWidth=2;g.beginPath();g.moveTo(x,y+30);g.lineTo(x,y+52);g.stroke();
  g.fillStyle=i%2?'#2c8a8a':'#6b7a3a';g.beginPath();g.arc(x,y,28,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,0.35)';g.beginPath();g.arc(x-9,y-9,8,0,TAU);g.fill();g.fillStyle='#333';g.fillRect(x-8,y+50,16,10)}
 const u=(t*0.7)%1;const bx=w*0.5,by=h*0.45;if(u<0.3){g.fillStyle='#c2402e';g.beginPath();g.arc(bx,by,28+u*20,0,TAU);g.fill()}else{g.fillStyle='#ffcf6a';for(let j=0;j<12;j++){const a=j*TAU/12,r=(u-0.3)*400;g.beginPath();g.arc(bx+Math.cos(a)*r,by+Math.sin(a)*r,5,0,TAU);g.fill()}}
 plane(g,w*0.5+Math.sin(t)*140,h*0.82,1.1)};
// F: the rival ace who darts in, fires and leaves, three times a stage
SCENES.f=(g,t,w,h)=>{sky(g,w,h);const p=(t*0.5)%1;const x=w*0.5+Math.sin(t*2.2)*w*0.38,y=p<0.5?-60+p*2*h*0.45:h*0.45-(p-0.5)*2*(h*0.45+80);
 g.save();g.translate(x,y);g.rotate(p<0.5?0:Math.PI);g.scale(1.6,1.6);g.fillStyle='#c2402e';g.beginPath();g.moveTo(0,18);g.lineTo(-7,-12);g.lineTo(7,-12);g.closePath();g.fill();g.fillRect(-26,-3,52,9);g.fillStyle='#f2e0c0';g.fillRect(-26,-3,8,9);g.fillRect(18,-3,8,9);g.restore();
 g.fillStyle='rgba(255,255,255,0.6)';for(let i=1;i<6;i++){g.beginPath();g.arc(x-Math.cos(t*2.2)*i*8,y-i*12,3,0,TAU);g.fill()}
 if(p>0.3&&p<0.5){g.fillStyle='#ffcf6a';for(let i=0;i<3;i++){g.beginPath();g.arc(x+(i-1)*30,y+40+(p-0.3)*900,5,0,TAU);g.fill()}}
 plane(g,w*0.5+Math.sin(t)*140,h*0.82,1.1)};
const DECISION = {
  title: "Updraft Aces Stage 2: pick a setting, a new enemy and the music",
  intro: "Stage 2 for Updraft Aces. Pick the setting, one new enemy kind and the play music. Each preview moves and shows your twin-engine from above. The previews are quick sketches. The real stage gets painted islands, clouds and enemies from Gemini like Stage 1.",
  note: "Same rules as Stage 1: no boss, soft fail, Breeze, Standard and Ace, power-ups from full formation clears and about 3 minutes in six sections. Stage 2 opens after you clear Cloud Harbor, and Stage 1 stays playable. The new enemy joins the olive and teal fighters you already picked. Add a note if you want to mix ideas.",
  label: "Updraft Aces Stage 2 picks",
  glance: [['a','A. Amber Canyon'],['b','B. Thunderhead Reach'],['c','C. Aurora North']],
  questions: [
    { id: "setting", name: "Stage 2 setting", sub: "One pick. Notes welcome.",
      options: [
        { title: "Amber Canyon", meta: ["Sunset over red rock mesas, stone arches and a winding river. Warm and bright, a clear step from the blue of Cloud Harbor.", "Fits the toy look best. Mesas and arches paint well as islands."], media: {draw:"a"}, rec: true },
        { title: "Thunderhead Reach", meta: ["Fly through a storm front. Dark clouds roll past, rain streaks and lightning flashes light the sky.", "The most drama. Darker, so bullets need a brighter glow."], media: {draw:"b"} },
        { title: "Aurora North", meta: ["Night over a frozen sea. Icebergs drift below and green and violet aurora ribbons wave above.", "Calm and pretty. A night stage changes the feel the most."], media: {draw:"c"} } ] },
    { id: "enemy", name: "New enemy kind", sub: "One pick. It shows up through Stage 2, never as a boss.",
      options: [
        { title: "Bombers", meta: ["Big slow planes in pairs. They drop flak shells that burst into a ring after a moment.", "Take several hits. Clear the pair for a power-up."], media: {draw:"d"}, rec: true },
        { title: "Balloon mines", meta: ["Balloons drift down slowly. Shot from far away they pop safely. Fly too close and they burst into a ring of bullets.", "Turns space into a puzzle without more shooting at you."], media: {draw:"e"} },
        { title: "The rival ace", meta: ["One fast red fighter darts in, fires a short burst and leaves. He shows up three times in the stage.", "Shoot him down on all three passes for a big bonus. Small and quick, not a boss."], media: {draw:"f"} } ] },
    { id: "music", name: "Stage 2 play music", sub: "One pick. All from Patch.gg, Kevin MacLeod, CC BY 4.0.",
      options: [
        { title: "Heroic Age", meta: ["Big and brassy. Feels like a second act."], media: {audio:"audio/heroic_age.ogg"}, rec: true },
        { title: "Upbeat Forever", meta: ["Bright and bouncy. Keeps the fun of Stage 1."], media: {audio:"audio/upbeat_forever.ogg"} },
        { title: "At Launch", meta: ["Driving and tense. Fits a storm or a night stage."], media: {audio:"audio/at_launch.ogg"} },
        { title: "Keep Beachfront Celebration", meta: ["Same music as Stage 1."], media: {audio:"audio/beachfront_celebration.ogg"} } ] } ]
};
const $=s=>document.querySelector(s), picks={};
$('#title').textContent=DECISION.title;$('#intro').textContent=DECISION.intro;$('#note').textContent=DECISION.note;
(function(){const sec=document.createElement('section');sec.innerHTML='<h2>All three settings at a glance</h2><p class="mute">A, B and C side by side. Details and Pick buttons are below.</p>';
 const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;width:100%';
 DECISION.glance.forEach(([k,label])=>{const col=document.createElement('div');col.style.cssText='flex:1 1 0;min-width:0';
  const cv=document.createElement('canvas');cv.width=600;cv.height=800;cv.dataset.draw=k;cv.style.cssText='width:100%;aspect-ratio:3/4;border-radius:8px;background:#000;display:block';
  const t=document.createElement('div');t.textContent=label;t.style.cssText='font:600 13px Inter,sans-serif;margin-top:4px;color:#f2b84b';col.appendChild(cv);col.appendChild(t);row.appendChild(col)});
 sec.appendChild(row);$('#main').appendChild(sec)})();
for(const q of DECISION.questions){
  const sec=document.createElement('section');
  sec.innerHTML=`<h2></h2><p class="mute"></p><div class="grid"></div><textarea rows="2" placeholder="Notes for this one (optional)"></textarea>`;
  sec.querySelector('h2').textContent=q.name;sec.querySelector('p').textContent=q.sub||'';
  q.options.forEach((o,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="opt">Option ${String.fromCharCode(65+i)}${o.rec?'<span class="rec">Recommended</span>':''}</div><h3></h3>`;
    c.querySelector('h3').textContent=o.title;
    for(const m of (o.meta||[])){const d=document.createElement('div');d.className='meta';d.textContent=m;c.appendChild(d)}
    const md=o.media||{};
    if(md.img){const e=document.createElement('img');e.src=md.img;e.alt=o.title;c.appendChild(e)}
    if(md.video){const e=document.createElement('video');e.src=md.video;e.controls=true;e.muted=true;e.loop=true;c.appendChild(e)}
    if(md.draw&&SCENES[md.draw]){const e=document.createElement('canvas');e.width=600;e.height=800;e.style.cssText='width:100%;max-width:480px;aspect-ratio:3/4;border-radius:10px;margin:8px 0;background:#000;display:block';e.dataset.draw=md.draw;const wr=document.createElement('div');wr.className='live';wr.appendChild(e);c.appendChild(wr)}
    if(md.audio){const e=document.createElement('audio');e.src=md.audio;e.controls=true;e.preload='none';c.appendChild(e)}
    const b=document.createElement('button');b.className='pick';b.textContent='Pick this one';c.appendChild(b);
    b.onclick=()=>{sec.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');picks[q.id]={q:q.name,o:o.title};draw()};
    sec.querySelector('.grid').appendChild(c)});
  sec.querySelector('textarea').oninput=e=>{(picks[q.id]=picks[q.id]||{q:q.name,o:''}).n=e.target.value;draw()};
  $('#main').appendChild(sec)}
const cvs=[...document.querySelectorAll('canvas[data-draw]')],seen=new Set();
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting?seen.add(x.target):seen.delete(x.target)));cvs.forEach(c=>io.observe(c));
let speed=2,clock=0,last=0;document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on',x===b))});

(function loop(ms){clock+=Math.min(100,ms-last)/1000*speed;last=ms;for(const c of seen){const g=c.getContext('2d');g.save();SCENES[c.dataset.draw](g,clock,c.width,c.height);g.restore()}requestAnimationFrame(loop)})(0);
document.addEventListener('play',e=>{document.querySelectorAll('audio,video').forEach(o=>{if(o!==e.target)o.pause()})},true);
function text(){return DECISION.label+': '+DECISION.questions.filter(q=>picks[q.id]).map(q=>{const p=picks[q.id];return q.name+': '+(p.o||'no pick')+(p.n?' ('+p.n.trim()+')':'')}).join('. ')+'.'}
function draw(){const n=DECISION.questions.filter(q=>picks[q.id]&&picks[q.id].o).length;$('#sum').textContent=n?`${n} of ${DECISION.questions.length} picked. `+text():'No picks yet.'}
$('#copy').onclick=async e=>{try{await navigator.clipboard.writeText(text());e.target.textContent='Copied'}catch(err){e.target.textContent='Select the text to copy'}setTimeout(()=>e.target.textContent='Copy my picks',1800)};
</script></body></html>
